name: External availability probe

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: external-availability-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: openstackV3/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: openstackV3
      - name: Probe the public project site
        env:
          TOAD_PROBE_URL: ${{ vars.TOAD_PROBE_URL || 'https://toad.remigirard.dev/' }}
        run: pnpm run probe -- --url "$TOAD_PROBE_URL" --expect 'name="application-name" content="TOAD"' --json
        working-directory: openstackV3
