<figure id="lesson-evidence" class="lesson" aria-label="Three independent checks for a successful release">
  <div class="lesson-top"><span class="lesson-label">SEE WHAT ACTUALLY HAPPENED</span><span class="lesson-example">Read-only monitoring</span></div>
  <div class="evidence-receipt"><div><span class="lesson-number">01 · VERSION</span><strong><!-- TOAD_ICON: package -->Did the right app ship?</strong><span>Requested image ↔ running task digests</span></div><div><span class="lesson-number">02 · RUNNING COPIES</span><strong><!-- TOAD_ICON: app-window -->Is the app ready?</strong><span>Ready replicas ↔ declared replicas</span></div><div><span class="lesson-number">03 · PUBLIC RESULT</span><strong><!-- TOAD_ICON: lock-keyhole -->Does its URL respond?</strong><span>Declared HTTPS checks ↔ expected result</span></div></div>
  <div class="lesson-caution"><strong>A green URL alone is not enough.</strong><span>A failed update can roll back to a healthy older version. Check all three, plus observation freshness, before calling the new release successful.</span></div>
  <figcaption>Open the <a href="/#agent-demo">interactive control room</a> to compare a successful release, a rollback and missing evidence. Your private view uses the same interface with observations from your selected cloud.</figcaption>
</figure>
