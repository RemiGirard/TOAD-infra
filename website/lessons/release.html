<figure class="lesson" aria-label="Code is packaged into an image, then run as containers">
  <div class="lesson-top"><span class="lesson-label">STEP 3 · PUT YOUR APP ON THE PLATFORM</span><span class="lesson-example">Repeat this for each release</span></div>
  <div class="release-pipeline"><div><span class="lesson-number">ON YOUR MACHINE</span><strong>Your app’s source</strong><span>Code + dependencies + Dockerfile</span></div><span class="release-action"><b>publish</b><span>build &amp; upload</span><i aria-hidden="true">→</i></span><div><span class="lesson-number">IN AN IMAGE REGISTRY</span><strong>A container image</strong><span>A packaged version of the app</span><small>Digest = its exact fingerprint</small></div><span class="release-action"><b>deploy</b><span>run that image</span><i aria-hidden="true">→</i></span><div><span class="lesson-number">ON YOUR CLOUD SERVERS</span><strong>Running containers</strong><span>App copies serving requests</span><small>Behind the same HTTPS entrance</small></div></div>
  <div class="lesson-pair"><p><strong>Image</strong><br>The package you can download again.</p><p><strong>Container</strong><br>A running instance of that package.</p></div>
  <p class="lesson-footnote">The my-app sample lives in TOAD's apps folder. Your own existing application can keep its source in its own repository.</p>
  <figcaption><strong>Checkpoint:</strong> the requested image is actually running and the declared HTTPS checks pass. Uploading an image alone does not put the app online.</figcaption>
  <p class="lesson-footnote">A database or saved uploads need a separate storage and backup plan. Running more app copies does not automatically replicate their data.</p>
</figure>
