<figure id="lesson-dns" class="lesson" aria-label="DNS delegation and the app address lookup">
  <div class="lesson-top"><span class="lesson-label">GIVE YOUR PLATFORM A NAME</span><span class="lesson-example">DNS is an address book</span></div>
  <div class="dns-zones"><div><span class="lesson-label">PARENT ZONE · INFOMANIAK DNS</span><strong><!-- TOAD_ICON: globe -->example.com</strong><span>You own this domain</span></div><div class="dns-delegation"><span class="lesson-tag">YOU · ONE TIME</span><strong>NS records for platform</strong><span>“Ask these nameservers about platform.example.com”</span><b aria-hidden="true">↓</b></div><div class="dns-child"><span class="lesson-label">CHILD ZONE · OPENSTACK DESIGNATE</span><strong><!-- TOAD_ICON: globe -->platform.example.com</strong><span>TOAD maintains its app-entry records</span><div class="dns-answer"><span><code>*.platform.example.com</code><small>A record · a name resolves to IPv4</small></span><b aria-hidden="true">→</b><code>198.51.100.30</code></div></div></div>
  <figcaption><strong>Then:</strong> my-app.platform.example.com uses the wildcard to find the app entrance. Traefik uses the hostname to choose my-app. Another app normally shares this IP; it does not need another VM or public IP.</figcaption>
  <p class="lesson-footnote">Use the actual nameservers and IPs from your stack outputs. Current apply also updates the parent @ and * A records; use a dedicated domain and review those changes first.</p>
</figure>
