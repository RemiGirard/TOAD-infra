<svg xmlns="http://www.w3.org/2000/svg" width="360" height="890" viewBox="0 0 360 890" role="img" aria-labelledby="title desc"><title id="title">Four tools, four jobs</title><desc id="desc">Heat resources, Ansible configuration, Swarm services, and Traefik HTTPS access.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c9362"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="8" width="340" height="136" rx="7" fill="#e3ead6" stroke="#bccaa9"/><text x="28" y="36" font-size="10" fill="#71865b" font-weight="600">DESIRED STATE + COORDINATION</text><text x="28" y="68" font-size="23" fill="#23362a" font-weight="600">Git → TypeScript CLI</text><text x="28" y="99" font-size="15" fill="#637457" font-weight="400">Resources, configuration, services</text><text x="28" y="123" font-size="15" fill="#637457" font-weight="400">Apply the inputs. Verify the result.</text><path d="M180 152 L180 172" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="180" width="340" height="145" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="208" font-size="10" fill="#71865b" font-weight="600">01 / CLOUD RESOURCES</text><text x="28" y="241" font-size="20" fill="#23362a" font-weight="600">OpenStack Heat</text><text x="28" y="268" font-size="13" fill="#637457" font-weight="400">Instances, network, DNS</text><text x="28" y="290" font-size="13" fill="#637457" font-weight="400">Octavia load balancer</text><path d="M180 325 L180 345" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="353" width="340" height="145" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="381" font-size="10" fill="#71865b" font-weight="600">02 / CONFIGURATION</text><text x="28" y="414" font-size="20" fill="#23362a" font-weight="600">Ansible</text><text x="28" y="441" font-size="13" fill="#637457" font-weight="400">Prepare cloud hosts</text><text x="28" y="463" font-size="13" fill="#637457" font-weight="400">Install Docker + stacks</text><path d="M180 498 L180 518" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="526" width="340" height="145" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="554" font-size="10" fill="#71865b" font-weight="600">03 / APPLICATIONS</text><text x="28" y="587" font-size="20" fill="#23362a" font-weight="600">Docker Swarm</text><text x="28" y="614" font-size="13" fill="#637457" font-weight="400">Run service replicas</text><text x="28" y="636" font-size="13" fill="#637457" font-weight="400">Updates and scheduling</text><path d="M180 671 L180 691" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="699" width="340" height="145" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="727" font-size="10" fill="#71865b" font-weight="600">04 / WEB ACCESS</text><text x="28" y="760" font-size="20" fill="#23362a" font-weight="600">Traefik</text><text x="28" y="787" font-size="13" fill="#637457" font-weight="400">Route to app services</text><text x="28" y="809" font-size="13" fill="#637457" font-weight="400">HTTPS certificates</text><text x="18" y="868" font-size="13" fill="#637457" font-weight="400">Provision once. Ship and operate your apps.</text></g></svg>
