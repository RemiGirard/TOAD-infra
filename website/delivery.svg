<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="258" viewBox="0 0 1120 258" role="img" aria-labelledby="title desc"><title id="title">From source to HTTPS</title><desc id="desc">Source, registry image, validated manifest, Swarm rollout, and HTTPS diagnosis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c9362"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><text x="16" y="18" font-size="10" fill="#71865b" font-weight="600">APPLICATION DELIVERY / AN EXISTING TOAD PLATFORM</text><rect x="16" y="45" width="192" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="34" y="73" font-size="10" fill="#71865b" font-weight="600">01 / MAKE IT YOURS</text><text x="34" y="106" font-size="20" fill="#23362a" font-weight="600">Source</text><text x="34" y="133" font-size="13" fill="#637457" font-weight="400">Frontend + Node API</text><text x="34" y="155" font-size="13" fill="#637457" font-weight="400">Run it locally</text><path d="M212 111 L232 111" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="240" y="45" width="192" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="258" y="73" font-size="10" fill="#71865b" font-weight="600">02 / PUBLISH</text><text x="258" y="106" font-size="20" fill="#23362a" font-weight="600">Registry image</text><text x="258" y="133" font-size="13" fill="#637457" font-weight="400">Build declared files</text><text x="258" y="155" font-size="13" fill="#637457" font-weight="400">Pin the image digest</text><path d="M436 111 L456 111" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="464" y="45" width="192" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="482" y="73" font-size="10" fill="#71865b" font-weight="600">03 / VALIDATE</text><text x="482" y="106" font-size="20" fill="#23362a" font-weight="600">App manifest</text><text x="482" y="133" font-size="13" fill="#637457" font-weight="400">Limits, secrets, routes</text><text x="482" y="155" font-size="13" fill="#637457" font-weight="400">Checked before deploy</text><path d="M660 111 L680 111" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="688" y="45" width="192" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="706" y="73" font-size="10" fill="#71865b" font-weight="600">04 / DEPLOY</text><text x="706" y="106" font-size="20" fill="#23362a" font-weight="600">Docker Swarm</text><text x="706" y="133" font-size="13" fill="#637457" font-weight="400">Rolling service update</text><text x="706" y="155" font-size="13" fill="#637457" font-weight="400">Health + rollback policy</text><path d="M884 111 L904 111" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="912" y="45" width="192" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="930" y="73" font-size="10" fill="#71865b" font-weight="600">05 / DIAGNOSE</text><text x="930" y="106" font-size="20" fill="#23362a" font-weight="600">Your HTTPS URL</text><text x="930" y="133" font-size="13" fill="#637457" font-weight="400">Replicas + failed tasks</text><text x="930" y="155" font-size="13" fill="#637457" font-weight="400">Public endpoint checks</text><text x="24" y="242" font-size="13" fill="#637457" font-weight="400">The manifest stays in Git. Swarm follows its update policy; diagnosis checks the result.</text></g></svg>
