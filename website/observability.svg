<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc"><title id="title">Infrastructure evidence for people and agents</title><desc id="desc">Hosts and apps produce metrics and logs. Prometheus and Loki feed protected Grafana dashboards. The TOAD CLI adds quorum, exact release verification and operation history to a private view shared by a human and their agent. External probes observe availability independently.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#708654"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" fill="#263a2c"><text x="28" y="29" font-size="12" letter-spacing="2">ONE EVIDENCE MODEL · TWO WAYS TO UNDERSTAND IT</text><g stroke="#90a179" fill="#f7f9f0"><rect x="24" y="69" width="216" height="200" rx="14"/><rect x="310" y="69" width="216" height="200" rx="14"/><rect x="596" y="69" width="216" height="200" rx="14"/><rect x="882" y="69" width="214" height="200" rx="14"/></g><g font-size="18" font-weight="bold"><text x="44" y="103">Infrastructure</text><text x="330" y="103">Signals</text><text x="616" y="103">TOAD evidence</text><text x="902" y="103">Human + agent</text></g><g font-size="15"><text x="44" y="143">Managers · services</text><text x="44" y="174">Routes · HTTPS</text><text x="44" y="205">Running image digests</text><text x="330" y="143">Prometheus · metrics</text><text x="330" y="174">Loki · service logs</text><text x="330" y="205">Independent probes</text><text x="616" y="143">Quorum · exact release</text><text x="616" y="174">Checks · alert state</text><text x="616" y="205">Operation stages</text><text x="902" y="143">Private visual view</text><text x="902" y="174">Structured JSON</text><text x="902" y="205">Timestamp + next action</text></g><g stroke="#708654" stroke-width="2" marker-end="url(#a)"><path d="M240 165H297"/><path d="M526 165H583"/><path d="M812 165H869"/></g><text x="28" y="316" font-size="15">Unknown stays unknown. Expired evidence is stale. A healthy old version does not prove a new release was delivered.</text></g></svg>
