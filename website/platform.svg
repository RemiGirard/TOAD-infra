<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="318" viewBox="0 0 1120 318" role="img" aria-labelledby="title desc"><title id="title">Four tools, four jobs</title><desc id="desc">Git and the TOAD CLI coordinate Heat, Ansible, Docker Swarm, and Traefik.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c9362"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="4" y="4" width="1112" height="88" rx="7" fill="#e3ead6" stroke="#bccaa9"/><text x="24" y="33" font-size="10" fill="#71865b" font-weight="600">DESIRED STATE</text><text x="24" y="66" font-size="20" fill="#23362a" font-weight="600">Git · Heat, Ansible, app manifests</text><path d="M470 49 L552 49" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><text x="582" y="36" font-size="10" fill="#71865b" font-weight="600">TOAD TYPESCRIPT CLI</text><text x="582" y="65" font-size="20" fill="#23362a" font-weight="600">Coordinate · apply · verify</text><rect x="4" y="132" width="266" height="140" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="22" y="160" font-size="10" fill="#71865b" font-weight="600">01 / CLOUD RESOURCES</text><text x="22" y="193" font-size="20" fill="#23362a" font-weight="600">OpenStack Heat</text><text x="22" y="220" font-size="13" fill="#637457" font-weight="400">Instances, network, DNS</text><text x="22" y="242" font-size="13" fill="#637457" font-weight="400">Octavia load balancer</text><path d="M274 202 L282 202" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="286" y="132" width="266" height="140" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="304" y="160" font-size="10" fill="#71865b" font-weight="600">02 / CONFIGURATION</text><text x="304" y="193" font-size="20" fill="#23362a" font-weight="600">Ansible</text><text x="304" y="220" font-size="13" fill="#637457" font-weight="400">Prepare cloud hosts</text><text x="304" y="242" font-size="13" fill="#637457" font-weight="400">Install Docker + stacks</text><path d="M556 202 L564 202" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="568" y="132" width="266" height="140" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="586" y="160" font-size="10" fill="#71865b" font-weight="600">03 / APPLICATIONS</text><text x="586" y="193" font-size="20" fill="#23362a" font-weight="600">Docker Swarm</text><text x="586" y="220" font-size="13" fill="#637457" font-weight="400">Run service replicas</text><text x="586" y="242" font-size="13" fill="#637457" font-weight="400">Updates and scheduling</text><path d="M838 202 L846 202" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="850" y="132" width="266" height="140" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="868" y="160" font-size="10" fill="#71865b" font-weight="600">04 / WEB ACCESS</text><text x="868" y="193" font-size="20" fill="#23362a" font-weight="600">Traefik</text><text x="868" y="220" font-size="13" fill="#637457" font-weight="400">Route to app services</text><text x="868" y="242" font-size="13" fill="#637457" font-weight="400">HTTPS certificates</text><text x="4" y="301" font-size="13" fill="#637457" font-weight="400">Provision the platform first. Deploy apps to it as a separate, repeatable workflow.</text></g></svg>
