---
- name: Apply conservative host hardening without changing the cloud firewall
  hosts: managers:workers
  serial: 1
  become: true
  tasks:
    - name: Install automatic security update and audit services
      ansible.builtin.apt:
        name: [unattended-upgrades, auditd]
        state: present
        update_cache: true

    - name: Enable daily package metadata and unattended security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Disable automatic reboots after unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52toad-unattended-upgrades
        mode: '0644'
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Harden SSH while preserving the manager jump-host path
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-toad.conf
        mode: '0644'
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          X11Forwarding no
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
      notify: Reload SSH

    - name: Validate effective SSH configuration
      ansible.builtin.command:
        argv: [sshd, -t]
      changed_when: false

    - name: Install kernel hardening settings compatible with Docker networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-toad-hardening.conf
        mode: '0644'
        content: |
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.perf_event_paranoid = 3
          kernel.unprivileged_bpf_disabled = 1
          fs.protected_fifos = 2
          fs.protected_regular = 2
          fs.protected_hardlinks = 1
          fs.protected_symlinks = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv4.tcp_syncookies = 1
      register: sysctl_hardening

    - name: Apply kernel hardening settings
      ansible.builtin.command:
        argv: [sysctl, --system]
      when: sysctl_hardening.changed

    - name: Enable audit service
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

  handlers:
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
