---
- name: Deploy the parent-domain landing service
  hosts: managers[0]
  become: true
  vars_files:
    - "{{ toad_router_config_path | default(playbook_dir ~ '/../../router/config.yaml') }}"
  vars:
    remote_dir: /opt/toad/root
  tasks:
    - name: Create deployment directory
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0750'

    - name: Copy the parent-domain stack files
      ansible.builtin.copy:
        src: "../../apps/root/{{ item }}"
        dest: "{{ remote_dir }}/{{ item }}"
        mode: '0640'
      loop:
        - docker-compose.yaml
        - nginx.conf
        - index.html

    - name: Deploy the parent-domain stack
      ansible.builtin.command:
        argv: [docker, stack, deploy, --prune, -c, docker-compose.yaml, root]
        chdir: "{{ remote_dir }}"
      environment:
        ROOT_DOMAIN: "{{ root_domain }}"
        ROOT_DOMAIN_REGEX: "{{ root_domain | replace('.', '[.]') }}"
      register: root_deploy
      changed_when: "'Updating service' in root_deploy.stdout or 'Creating service' in root_deploy.stdout"
