# Syntax-checking and manual-operation example only.
# The normal production path generates openstackV3/inventory.yaml from Heat.

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: /secure/path/to/operator-key
    ansible_ssh_common_args: -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
  children:
    managers:
      hosts:
        example-manager-1:
          ansible_host: 192.0.2.10
          private_ip: 10.0.0.10
    workers:
      hosts: {}
