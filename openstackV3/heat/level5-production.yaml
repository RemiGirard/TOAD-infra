heat_template_version: '2018-08-31'

description: |
  TOAD production Swarm: exactly three manager nodes and an Octavia load
  balancer. Manager 1 has a restricted floating IP for bootstrap/SSH; Octavia
  has the public web IP and passes TCP 80/443 to the Swarm routing mesh.

parameters:
  flavor:
    type: string
    description: Nova flavor used for all three managers
    constraints:
      - custom_constraint: nova.flavor

  image:
    type: string
    description: Ubuntu image used by every server
    constraints:
      - custom_constraint: glance.image

  keypair_name:
    type: string
    description: Nova SSH keypair name
    constraints:
      - custom_constraint: nova.keypair

  public_network:
    type: string
    description: External network used only for floating IPs
    default: ext-floating1

  ssh_allowed_cidr:
    type: string
    description: Public CIDR permitted to reach manager 1 on port 22
    default: 192.0.2.1/32
    constraints:
      - allowed_pattern: '^(?:\d{1,3}\.){3}\d{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
        description: Must be an IPv4 CIDR

  dns_zone_name:
    type: string
    description: Delegated DNS zone owned by this stack (must end with a dot)

  dns_email:
    type: string
    description: SOA contact for the delegated DNS zone

  manager1_availability_zone:
    type: string
    default: az-1
  manager2_availability_zone:
    type: string
    default: az-2
  manager3_availability_zone:
    type: string
    default: az-3

resources:
  manager_server_group:
    type: OS::Nova::ServerGroup
    properties:
      name:
        str_replace:
          template: STACK-managers
          params:
            STACK: { get_param: OS::stack_name }
      policies: [soft-anti-affinity]

  ssh_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: Restricted public SSH entry point
      rules:
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: { get_param: ssh_allowed_cidr }
        - direction: egress
          ethertype: IPv4
          remote_ip_prefix: 0.0.0.0/0

  manager_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: Private Swarm control/data plane plus web traffic from Octavia
      rules:
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 443
          port_range_max: 443
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 2377
          port_range_max: 2377
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 7946
          port_range_max: 7946
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: udp
          port_range_min: 7946
          port_range_max: 7946
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: udp
          port_range_min: 4789
          port_range_max: 4789
          remote_ip_prefix: 10.0.0.0/24
        - direction: ingress
          ethertype: IPv4
          protocol: icmp
          remote_ip_prefix: 10.0.0.0/24
        - direction: egress
          ethertype: IPv4
          remote_ip_prefix: 0.0.0.0/0

  private_network:
    type: OS::Neutron::Net
    properties:
      name:
        str_replace:
          template: STACK-swarm-net
          params:
            STACK: { get_param: OS::stack_name }

  private_subnet:
    type: OS::Neutron::Subnet
    properties:
      network_id: { get_resource: private_network }
      cidr: 10.0.0.0/24
      gateway_ip: 10.0.0.1
      dns_nameservers: [1.1.1.1, 9.9.9.9]

  router:
    type: OS::Neutron::Router
    properties:
      external_gateway_info:
        network: { get_param: public_network }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: private_subnet }

  manager1_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: manager_security_group }
        - { get_resource: ssh_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.20

  manager1_floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on: router_interface
    properties:
      floating_network: { get_param: public_network }
      port_id: { get_resource: manager1_port }

  manager2_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups: [{ get_resource: manager_security_group }]
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.21

  manager3_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups: [{ get_resource: manager_security_group }]
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.22

  manager1:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: STACK-manager-1
          params:
            STACK: { get_param: OS::stack_name }
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks: [{ port: { get_resource: manager1_port } }]
      availability_zone: { get_param: manager1_availability_zone }
      scheduler_hints:
        group: { get_resource: manager_server_group }
      user_data_format: RAW
      user_data: |
        #cloud-config
        package_update: true
        packages: [ca-certificates, curl]
      metadata:
        toad_role: swarm-manager

  manager2:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: STACK-manager-2
          params:
            STACK: { get_param: OS::stack_name }
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks: [{ port: { get_resource: manager2_port } }]
      availability_zone: { get_param: manager2_availability_zone }
      scheduler_hints:
        group: { get_resource: manager_server_group }
      user_data_format: RAW
      user_data: |
        #cloud-config
        package_update: true
        packages: [ca-certificates, curl]
      metadata:
        toad_role: swarm-manager

  manager3:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: STACK-manager-3
          params:
            STACK: { get_param: OS::stack_name }
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks: [{ port: { get_resource: manager3_port } }]
      availability_zone: { get_param: manager3_availability_zone }
      scheduler_hints:
        group: { get_resource: manager_server_group }
      user_data_format: RAW
      user_data: |
        #cloud-config
        package_update: true
        packages: [ca-certificates, curl]
      metadata:
        toad_role: swarm-manager

  loadbalancer:
    type: OS::Octavia::LoadBalancer
    depends_on: router_interface
    properties:
      name:
        str_replace:
          template: STACK-ingress
          params:
            STACK: { get_param: OS::stack_name }
      vip_subnet: { get_resource: private_subnet }

  loadbalancer_floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on: loadbalancer
    properties:
      floating_network: { get_param: public_network }
      port_id: { get_attr: [loadbalancer, vip_port_id] }

  dns_zone:
    type: OS::Designate::Zone
    properties:
      name: { get_param: dns_zone_name }
      email: { get_param: dns_email }
      description: Managed by the TOAD Heat stack
      type: PRIMARY
      ttl: 300

  dns_apex_record:
    type: OS::Designate::RecordSet
    properties:
      zone: { get_resource: dns_zone }
      name: { get_param: dns_zone_name }
      type: A
      ttl: 60
      records: [{ get_attr: [loadbalancer_floating_ip, floating_ip_address] }]

  dns_wildcard_record:
    type: OS::Designate::RecordSet
    properties:
      zone: { get_resource: dns_zone }
      name:
        str_replace:
          template: '*.ZONE'
          params:
            ZONE: { get_param: dns_zone_name }
      type: A
      ttl: 60
      records: [{ get_attr: [loadbalancer_floating_ip, floating_ip_address] }]

  http_listener:
    type: OS::Octavia::Listener
    properties:
      name: toad-http
      loadbalancer: { get_resource: loadbalancer }
      protocol: TCP
      protocol_port: 80

  http_pool:
    type: OS::Octavia::Pool
    properties:
      name: toad-http-managers
      listener: { get_resource: http_listener }
      lb_algorithm: ROUND_ROBIN
      protocol: TCP

  http_member1:
    type: OS::Octavia::PoolMember
    depends_on: manager1
    properties: { pool: { get_resource: http_pool }, address: 10.0.0.20, protocol_port: 80, subnet: { get_resource: private_subnet } }
  http_member2:
    type: OS::Octavia::PoolMember
    depends_on: manager2
    properties: { pool: { get_resource: http_pool }, address: 10.0.0.21, protocol_port: 80, subnet: { get_resource: private_subnet } }
  http_member3:
    type: OS::Octavia::PoolMember
    depends_on: manager3
    properties: { pool: { get_resource: http_pool }, address: 10.0.0.22, protocol_port: 80, subnet: { get_resource: private_subnet } }

  http_healthmonitor:
    type: OS::Octavia::HealthMonitor
    properties:
      pool: { get_resource: http_pool }
      type: TCP
      delay: 10
      timeout: 5
      max_retries: 3

  https_listener:
    type: OS::Octavia::Listener
    properties:
      name: toad-https
      loadbalancer: { get_resource: loadbalancer }
      protocol: TCP
      protocol_port: 443

  https_pool:
    type: OS::Octavia::Pool
    properties:
      name: toad-https-managers
      listener: { get_resource: https_listener }
      lb_algorithm: ROUND_ROBIN
      protocol: TCP

  https_member1:
    type: OS::Octavia::PoolMember
    depends_on: manager1
    properties: { pool: { get_resource: https_pool }, address: 10.0.0.20, protocol_port: 443, subnet: { get_resource: private_subnet } }
  https_member2:
    type: OS::Octavia::PoolMember
    depends_on: manager2
    properties: { pool: { get_resource: https_pool }, address: 10.0.0.21, protocol_port: 443, subnet: { get_resource: private_subnet } }
  https_member3:
    type: OS::Octavia::PoolMember
    depends_on: manager3
    properties: { pool: { get_resource: https_pool }, address: 10.0.0.22, protocol_port: 443, subnet: { get_resource: private_subnet } }

  https_healthmonitor:
    type: OS::Octavia::HealthMonitor
    properties:
      pool: { get_resource: https_pool }
      type: TCP
      delay: 10
      timeout: 5
      max_retries: 3

outputs:
  ssh_floating_ip:
    description: Restricted public SSH entry point on manager 1
    value: { get_attr: [manager1_floating_ip, floating_ip_address] }
  lb_floating_ip:
    description: Public HTTP/HTTPS entry point; point application DNS here
    value: { get_attr: [loadbalancer_floating_ip, floating_ip_address] }
  swarm_private_ips:
    description: Private IPs of the three Swarm managers
    value: [10.0.0.20, 10.0.0.21, 10.0.0.22]
  manager_private_ips:
    value: [10.0.0.20, 10.0.0.21, 10.0.0.22]
  network_id:
    value: { get_resource: private_network }
  loadbalancer_id:
    value: { get_resource: loadbalancer }
  dns_zone_id:
    value: { get_resource: dns_zone }
  dns_zone_name:
    value: { get_param: dns_zone_name }
