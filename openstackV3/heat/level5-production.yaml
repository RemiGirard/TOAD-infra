heat_template_version: '2018-08-31'

description: |
  TOAD Level 5: High Availability Docker Swarm

  Architecture:
  - 1 Bastion node with floating IP (SSH access)
  - 1 Octavia Load Balancer with floating IP (HTTP/HTTPS)
  - 2 Gateway nodes running Traefik (behind LB)
  - 3 Swarm nodes on private network
  - Total: 6 nodes, 2 floating IPs

  Traffic flow:
  - HTTP/HTTPS: Internet → LB floating IP → Gateways → Swarm
  - SSH: Internet → Bastion floating IP → All nodes

  No single point of failure for web traffic.

parameters:
  flavor:
    type: string
    description: Nova flavor for all nodes
    constraints:
      - custom_constraint: nova.flavor

  image:
    type: string
    description: Glance image name
    constraints:
      - custom_constraint: glance.image

  keypair_name:
    type: string
    description: SSH keypair name
    constraints:
      - custom_constraint: nova.keypair

  public_network:
    type: string
    description: Public network for floating IPs
    default: "ext-floating1"

  ssh_allowed_cidr:
    type: string
    description: CIDR allowed for SSH access (restrict to your IP for security)
    default: "0.0.0.0/0"

  gateway_count:
    type: number
    description: Number of gateway/Traefik nodes
    default: 2
    constraints:
      - range: { min: 2, max: 4 }

  swarm_node_count:
    type: number
    description: Number of Swarm nodes
    default: 3
    constraints:
      - range: { min: 1, max: 10 }

resources:
  # === SECURITY GROUPS ===

  bastion_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: Security group for bastion (SSH access point)
      rules:
        # SSH (restricted by parameter)
        - remote_ip_prefix: { get_param: ssh_allowed_cidr }
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress
        # ICMP internal only
        - remote_ip_prefix: 10.0.0.0/24
          protocol: icmp
          direction: ingress
        # Egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          direction: egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: udp
          direction: egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: icmp
          direction: egress

  gateway_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: Security group for gateway nodes (behind LB)
      rules:
        # SSH from bastion
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress
        # HTTP from LB
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
          direction: ingress
        # HTTPS from LB
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 443
          port_range_max: 443
          direction: ingress
        # ICMP
        - remote_ip_prefix: 10.0.0.0/24
          protocol: icmp
          direction: ingress
        # Egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          direction: egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: udp
          direction: egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: icmp
          direction: egress

  swarm_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: Security group for swarm nodes
      rules:
        # SSH from bastion
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress
        # HTTP/HTTPS from gateways
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
          direction: ingress
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 443
          port_range_max: 443
          direction: ingress
        # Docker Swarm management
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 2377
          port_range_max: 2377
          direction: ingress
        # Docker Swarm node communication
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 7946
          port_range_max: 7946
          direction: ingress
        - remote_ip_prefix: 10.0.0.0/24
          protocol: udp
          port_range_min: 7946
          port_range_max: 7946
          direction: ingress
        # Docker overlay network
        - remote_ip_prefix: 10.0.0.0/24
          protocol: udp
          port_range_min: 4789
          port_range_max: 4789
          direction: ingress
        # Docker Registry
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 5000
          port_range_max: 5000
          direction: ingress
        # Application ports (Traefik backend services)
        - remote_ip_prefix: 10.0.0.0/24
          protocol: tcp
          port_range_min: 8000
          port_range_max: 9000
          direction: ingress
        # ICMP
        - remote_ip_prefix: 10.0.0.0/24
          protocol: icmp
          direction: ingress
        # Egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          direction: egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: udp
          direction: egress
        - remote_ip_prefix: 0.0.0.0/0
          protocol: icmp
          direction: egress

  # === NETWORK ===

  private_network:
    type: OS::Neutron::Net
    properties:
      name: toad-level5-net

  private_subnet:
    type: OS::Neutron::Subnet
    properties:
      network_id: { get_resource: private_network }
      cidr: 10.0.0.0/24
      gateway_ip: 10.0.0.1
      dns_nameservers:
        - 8.8.8.8
        - 8.8.4.4

  router:
    type: OS::Neutron::Router
    properties:
      external_gateway_info:
        network: { get_param: public_network }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: private_subnet }

  # === BASTION NODE ===

  bastion_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: bastion_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.5

  bastion_floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on: router_interface
    properties:
      floating_network: { get_param: public_network }
      port_id: { get_resource: bastion_port }

  bastion:
    type: OS::Nova::Server
    properties:
      name: toad-bastion
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: bastion_port }
      user_data: |
        #!/bin/bash
        apt-get update && apt-get upgrade -y
        apt-get install -y curl wget git jq htop
      metadata:
        role: bastion

  # === GATEWAY NODES ===

  gateway1_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: gateway_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.10

  gateway1:
    type: OS::Nova::Server
    properties:
      name: toad-gateway-1
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: gateway1_port }
      user_data: |
        #!/bin/bash
        apt-get update && apt-get upgrade -y
        apt-get install -y curl wget git jq htop
      metadata:
        role: gateway

  gateway2_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: gateway_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.11

  gateway2:
    type: OS::Nova::Server
    properties:
      name: toad-gateway-2
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: gateway2_port }
      user_data: |
        #!/bin/bash
        apt-get update && apt-get upgrade -y
        apt-get install -y curl wget git jq htop
      metadata:
        role: gateway

  # === SWARM NODES ===

  swarm1_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: swarm_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.20

  swarm1:
    type: OS::Nova::Server
    properties:
      name: toad-swarm-1
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: swarm1_port }
      user_data: |
        #!/bin/bash
        apt-get update && apt-get upgrade -y
        apt-get install -y curl wget git jq htop
      metadata:
        role: swarm-manager

  swarm2_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: swarm_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.21

  swarm2:
    type: OS::Nova::Server
    properties:
      name: toad-swarm-2
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: swarm2_port }
      user_data: |
        #!/bin/bash
        apt-get update && apt-get upgrade -y
        apt-get install -y curl wget git jq htop
      metadata:
        role: swarm-worker

  swarm3_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: swarm_security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.22

  swarm3:
    type: OS::Nova::Server
    properties:
      name: toad-swarm-3
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: swarm3_port }
      user_data: |
        #!/bin/bash
        apt-get update && apt-get upgrade -y
        apt-get install -y curl wget git jq htop
      metadata:
        role: swarm-worker

  # === OCTAVIA LOAD BALANCER ===

  loadbalancer:
    type: OS::Octavia::LoadBalancer
    depends_on: router_interface
    properties:
      name: toad-lb
      vip_subnet: { get_resource: private_subnet }

  lb_floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on: loadbalancer
    properties:
      floating_network: { get_param: public_network }
      port_id: { get_attr: [loadbalancer, vip_port_id] }

  # HTTP Listener
  listener_http:
    type: OS::Octavia::Listener
    properties:
      name: toad-listener-http
      loadbalancer: { get_resource: loadbalancer }
      protocol: HTTP
      protocol_port: 80

  pool_http:
    type: OS::Octavia::Pool
    properties:
      name: toad-pool-http
      listener: { get_resource: listener_http }
      lb_algorithm: ROUND_ROBIN
      protocol: HTTP

  pool_http_member1:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool_http }
      address: 10.0.0.10
      protocol_port: 80
      subnet: { get_resource: private_subnet }

  pool_http_member2:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool_http }
      address: 10.0.0.11
      protocol_port: 80
      subnet: { get_resource: private_subnet }

  healthmonitor_http:
    type: OS::Octavia::HealthMonitor
    properties:
      pool: { get_resource: pool_http }
      type: HTTP
      delay: 5
      max_retries: 3
      timeout: 5
      http_method: GET
      url_path: /

  # HTTPS Listener
  listener_https:
    type: OS::Octavia::Listener
    properties:
      name: toad-listener-https
      loadbalancer: { get_resource: loadbalancer }
      protocol: HTTPS
      protocol_port: 443

  pool_https:
    type: OS::Octavia::Pool
    properties:
      name: toad-pool-https
      listener: { get_resource: listener_https }
      lb_algorithm: ROUND_ROBIN
      protocol: HTTPS

  pool_https_member1:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool_https }
      address: 10.0.0.10
      protocol_port: 443
      subnet: { get_resource: private_subnet }

  pool_https_member2:
    type: OS::Octavia::PoolMember
    properties:
      pool: { get_resource: pool_https }
      address: 10.0.0.11
      protocol_port: 443
      subnet: { get_resource: private_subnet }

  healthmonitor_https:
    type: OS::Octavia::HealthMonitor
    properties:
      pool: { get_resource: pool_https }
      type: TCP
      delay: 5
      max_retries: 3
      timeout: 5

outputs:
  bastion_floating_ip:
    description: Bastion public IP (SSH access)
    value: { get_attr: [bastion_floating_ip, floating_ip_address] }

  lb_floating_ip:
    description: Load Balancer public IP (HTTP/HTTPS)
    value: { get_attr: [lb_floating_ip, floating_ip_address] }

  bastion_private_ip:
    description: Bastion private IP
    value: 10.0.0.5

  gateway_private_ips:
    description: Gateway node private IPs
    value:
      - 10.0.0.10
      - 10.0.0.11

  swarm_private_ips:
    description: Swarm node private IPs
    value:
      - 10.0.0.20
      - 10.0.0.21
      - 10.0.0.22

  ssh_bastion:
    description: SSH to bastion
    value:
      str_replace:
        template: ssh ubuntu@IP
        params:
          IP: { get_attr: [bastion_floating_ip, floating_ip_address] }

  ssh_via_bastion:
    description: SSH to internal nodes via bastion
    value: "ssh -J ubuntu@<bastion-ip> ubuntu@10.0.0.10"

  web_url:
    description: Web access URL
    value:
      str_replace:
        template: http://IP
        params:
          IP: { get_attr: [lb_floating_ip, floating_ip_address] }

  network_id:
    description: Private network ID
    value: { get_resource: private_network }

  loadbalancer_id:
    description: Load Balancer ID
    value: { get_resource: loadbalancer }
