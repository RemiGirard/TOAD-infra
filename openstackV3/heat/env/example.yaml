# TOAD Heat Environment File - Example
# Copy to a new file (e.g., myenv.yaml) and customize
# Usage: openstack stack create -t heat/levelX.yaml -e heat/env/myenv.yaml stack-name

parameters:
  # Instance flavor (run: openstack flavor list)
  # Small: a1-ram2-disk20-perf1 (1 vCPU, 2GB RAM)
  # Medium: a2-ram4-disk20-perf1 (2 vCPU, 4GB RAM)
  # Large: a4-ram8-disk50-perf1 (4 vCPU, 8GB RAM)
  flavor: "a1-ram2-disk20-perf1"

  # Immutable OpenStack image UUID (run: pnpm run discover).
  # Do not use the mutable display name in a client/reproducible environment.
  image: "REPLACE_WITH_IMAGE_UUID"

  # SSH keypair name (run: openstack keypair list)
  keypair_name: "toad-key"

  # External network for floating IPs
  public_network: "ext-floating1"

  # Safe documentation default. The TypeScript apply command replaces this
  # with the operator workstation's current public IPv4 /32.
  ssh_allowed_cidr: "192.0.2.1/32"

  # Delegated child zone managed by OpenStack Designate
  dns_zone_name: "platform.example.com."
  dns_email: "hostmaster@example.com"

  # Spread the three managers across failure domains
  manager1_availability_zone: "az-1"
  manager2_availability_zone: "az-2"
  manager3_availability_zone: "az-3"
