heat_template_version: '2018-08-31'

description: |
  TOAD single-node Swarm profile for development and small workloads.
  The node has one floating IP and exposes only SSH, HTTP, HTTPS, and ICMP.

parameters:
  flavor:
    type: string
    constraints:
      - custom_constraint: nova.flavor
  image:
    type: string
    constraints:
      - custom_constraint: glance.image
  keypair_name:
    type: string
    constraints:
      - custom_constraint: nova.keypair
  public_network:
    type: string
    default: ext-floating1
  ssh_allowed_cidr:
    type: string
    description: Public CIDR permitted to reach SSH
    default: 0.0.0.0/0

resources:
  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: TOAD single-node ingress
      rules:
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: { get_param: ssh_allowed_cidr }
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
          remote_ip_prefix: 0.0.0.0/0
        - direction: ingress
          ethertype: IPv4
          protocol: tcp
          port_range_min: 443
          port_range_max: 443
          remote_ip_prefix: 0.0.0.0/0
        - direction: ingress
          ethertype: IPv4
          protocol: icmp
          remote_ip_prefix: 0.0.0.0/0
        - direction: egress
          ethertype: IPv4
          remote_ip_prefix: 0.0.0.0/0

  private_network:
    type: OS::Neutron::Net
    properties:
      name:
        str_replace:
          template: STACK-swarm-net
          params:
            STACK: { get_param: OS::stack_name }

  private_subnet:
    type: OS::Neutron::Subnet
    properties:
      network_id: { get_resource: private_network }
      cidr: 10.0.0.0/24
      gateway_ip: 10.0.0.1
      dns_nameservers: [1.1.1.1, 9.9.9.9]

  router:
    type: OS::Neutron::Router
    properties:
      external_gateway_info:
        network: { get_param: public_network }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: private_subnet }

  manager_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups: [{ get_resource: security_group }]
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }
          ip_address: 10.0.0.10

  manager_floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on: router_interface
    properties:
      floating_network: { get_param: public_network }
      port_id: { get_resource: manager_port }

  manager:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: STACK-manager-1
          params:
            STACK: { get_param: OS::stack_name }
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks: [{ port: { get_resource: manager_port } }]
      user_data_format: RAW
      user_data: |
        #cloud-config
        package_update: true
        packages: [ca-certificates, curl]
      metadata:
        toad_role: swarm-manager

outputs:
  server_id:
    value: { get_resource: manager }
  server_name:
    value: { get_attr: [manager, name] }
  private_ip:
    value: 10.0.0.10
  manager_private_ips:
    value: [10.0.0.10]
  floating_ip:
    description: Public SSH and HTTP/HTTPS address
    value: { get_attr: [manager_floating_ip, floating_ip_address] }
  network_id:
    value: { get_resource: private_network }
