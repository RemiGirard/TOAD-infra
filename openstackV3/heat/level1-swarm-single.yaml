heat_template_version: '2018-08-31'

description: |
  TOAD Level 1: Single Node Docker Swarm Ready

  Provisions a single VM with:
  - Security group allowing SSH (22), HTTP (80), HTTPS (443)
  - Docker Swarm ports (2377 TCP, 7946 TCP/UDP, 4789 UDP)
  - Floating IP for public access
  - Cloud-init for basic OS setup only

  Docker and Swarm initialization is handled by Ansible.

parameters:
  flavor:
    type: string
    description: Nova flavor name
    constraints:
      - custom_constraint: nova.flavor

  image:
    type: string
    description: Glance image name
    constraints:
      - custom_constraint: glance.image

  keypair_name:
    type: string
    description: Nova keypair name for SSH access
    constraints:
      - custom_constraint: nova.keypair

  public_network:
    type: string
    description: Name of the public network for floating IPs
    default: "public"

resources:
  security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      description: Security group for Swarm-ready node
      rules:
        # SSH
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 22
          port_range_max: 22
          direction: ingress

        # HTTP
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 80
          port_range_max: 80
          direction: ingress

        # HTTPS
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 443
          port_range_max: 443
          direction: ingress

        # Docker Swarm - Port 2377 (TCP) for manager communication
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 2377
          port_range_max: 2377
          direction: ingress

        # Docker Swarm - Port 7946 (TCP/UDP) for node communication
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          port_range_min: 7946
          port_range_max: 7946
          direction: ingress

        - remote_ip_prefix: 0.0.0.0/0
          protocol: udp
          port_range_min: 7946
          port_range_max: 7946
          direction: ingress

        # Docker Swarm - Port 4789 (UDP) for overlay network
        - remote_ip_prefix: 0.0.0.0/0
          protocol: udp
          port_range_min: 4789
          port_range_max: 4789
          direction: ingress

        # ICMP (ping)
        - remote_ip_prefix: 0.0.0.0/0
          protocol: icmp
          direction: ingress

        # Egress rules (allow all)
        - remote_ip_prefix: 0.0.0.0/0
          protocol: tcp
          direction: egress

        - remote_ip_prefix: 0.0.0.0/0
          protocol: udp
          direction: egress

        - remote_ip_prefix: 0.0.0.0/0
          protocol: icmp
          direction: egress

  private_network:
    type: OS::Neutron::Net
    properties:
      name: toad-level1-net

  private_subnet:
    type: OS::Neutron::Subnet
    properties:
      network_id: { get_resource: private_network }
      cidr: 10.0.0.0/24
      gateway_ip: 10.0.0.1
      dns_nameservers:
        - 8.8.8.8
        - 8.8.4.4

  router:
    type: OS::Neutron::Router
    properties:
      external_gateway_info:
        network: { get_param: public_network }

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: private_subnet }

  instance_port:
    type: OS::Neutron::Port
    properties:
      network_id: { get_resource: private_network }
      security_groups:
        - { get_resource: security_group }
      fixed_ips:
        - subnet_id: { get_resource: private_subnet }

  floating_ip:
    type: OS::Neutron::FloatingIP
    depends_on: router_interface
    properties:
      floating_network: { get_param: public_network }
      port_id: { get_resource: instance_port }

  # Compute instance
  server:
    type: OS::Nova::Server
    properties:
      name: toad-level1-node
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_param: keypair_name }
      networks:
        - port: { get_resource: instance_port }
      user_data: |
        #!/bin/bash
        set -e
        apt-get update
        apt-get upgrade -y
        apt-get autoremove -y
        apt-get clean
        apt-get install -y curl wget git jq htop
      metadata:
        stack: { get_stack_id }

outputs:
  server_id:
    description: Server ID
    value: { get_resource: server }

  server_name:
    description: Server name
    value: { get_attr: [server, name] }

  private_ip:
    description: Private IP address
    value: { get_attr: [server, networks, toad-level1-net, 0] }

  floating_ip:
    description: Floating public IP address
    value: { get_attr: [floating_ip, floating_ip_address] }

  ssh_command:
    description: SSH command to connect to the server
    value:
      str_replace:
        template: "ssh -i /path/to/key ubuntu@IP"
        params:
          IP: { get_attr: [floating_ip, floating_ip_address] }

  security_group_id:
    description: Security group ID
    value: { get_resource: security_group }

  network_id:
    description: Private network ID
    value: { get_resource: private_network }

  swarm_ready:
    description: Node is configured for Docker Swarm
    value: "true"
