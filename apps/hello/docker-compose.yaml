services:
  hello:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    security_opt: [no-new-privileges:true]
    networks: [traefik-public]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.hello.rule=Host(`hello.${TOAD_DOMAIN}`)"
        - "traefik.http.routers.hello.entrypoints=websecure"
        - "traefik.http.routers.hello.tls=true"
        - "traefik.http.routers.hello.tls.certresolver=letsencrypt"
        - "traefik.http.services.hello.loadbalancer.server.port=80"
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    security_opt: [no-new-privileges:true]
    networks: [traefik-public]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.whoami.rule=Host(`whoami.${TOAD_DOMAIN}`)"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
        - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

networks:
  traefik-public:
    external: true
