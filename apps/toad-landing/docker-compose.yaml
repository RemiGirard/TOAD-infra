    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      labels:
        - traefik.enable=true
        - traefik.http.routers.toad-site.rule=Host(`toad.remigirard.dev`)
        - traefik.http.routers.toad-site.priority=100
        - traefik.http.routers.toad-site.entrypoints=websecure
        - traefik.http.routers.toad-site.tls=true
        - traefik.http.routers.toad-site.tls.certresolver=infomaniak
        - traefik.http.services.toad-site.loadbalancer.server.port=80
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 2m
