services:
  web:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik-public
    configs:
      - source: asset-0
        target: /usr/share/nginx/html/index.html
      - source: asset-1
        target: /usr/share/nginx/html/style.css
      - source: asset-2
        target: /usr/share/nginx/html/app.mjs
      - source: asset-3
        target: /usr/share/nginx/html/toad.svg
      - source: asset-4
        target: /usr/share/nginx/html/starter.png
      - source: asset-5
        target: /usr/share/nginx/html/walkthrough.json
      - source: asset-6
        target: /usr/share/nginx/html/walkthrough.css
      - source: asset-7
        target: /usr/share/nginx/html/quickstart.html
      - source: asset-8
        target: /usr/share/nginx/html/first-app.html
      - source: asset-9
        target: /usr/share/nginx/html/evaluation.html
      - source: asset-10
        target: /usr/share/nginx/html/deployment.html
      - source: asset-11
        target: /usr/share/nginx/html/costs.html
      - source: asset-12
        target: /usr/share/nginx/html/operations.html
      - source: asset-13
        target: /usr/share/nginx/html/recovery.html
      - source: asset-14
        target: /usr/share/nginx/html/launch.html
      - source: asset-15
        target: /usr/share/nginx/html/backups.html
      - source: asset-16
        target: /usr/share/nginx/html/drill-plan.html
      - source: asset-17
        target: /usr/share/nginx/html/agents.html
      - source: asset-18
        target: /usr/share/nginx/html/storage.html
      - source: asset-19
        target: /usr/share/nginx/html/security.html
      - source: asset-20
        target: /usr/share/nginx/html/license.html
      - source: asset-21
        target: /usr/share/nginx/html/robots.txt
      - source: asset-22
        target: /usr/share/nginx/html/sitemap.xml
      - source: asset-23
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/healthz
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      labels:
        - traefik.enable=true
        - traefik.http.routers.toad-site.rule=Host(`toad.remigirard.dev`)
        - traefik.http.routers.toad-site.priority=100
        - traefik.http.routers.toad-site.entrypoints=websecure
        - traefik.http.routers.toad-site.tls=true
        - traefik.http.routers.toad-site.tls.certresolver=infomaniak
        - traefik.http.services.toad-site.loadbalancer.server.port=80
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 2m
