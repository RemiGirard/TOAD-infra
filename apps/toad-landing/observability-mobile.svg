<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 790" role="img" aria-labelledby="title desc"><title id="title">Signals shared by people and agents</title><desc id="desc">Infrastructure produces metrics, logs and external probe evidence. TOAD combines it with quorum, release and operation checks for a private human view and structured agent JSON.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#708654"/></marker></defs><g font-family="Arial,Helvetica,sans-serif" fill="#263a2c"><text x="20" y="25" font-size="12" letter-spacing="1">SHARED EVIDENCE · PRIVATE OPERATION VIEW</text><g fill="#f7f9f0" stroke="#90a179"><rect x="20" y="50" width="320" height="130" rx="14"/><rect x="20" y="225" width="320" height="130" rx="14"/><rect x="20" y="400" width="320" height="130" rx="14"/><rect x="20" y="575" width="320" height="130" rx="14"/></g><g font-size="19" font-weight="bold"><text x="40" y="84">Infrastructure</text><text x="40" y="259">Signals</text><text x="40" y="434">TOAD evidence</text><text x="40" y="609">Human + agent</text></g><g font-size="15"><text x="40" y="117">Managers · services · HTTPS</text><text x="40" y="147">Running image digests</text><text x="40" y="292">Prometheus · Loki</text><text x="40" y="322">Independent external probes</text><text x="40" y="467">Quorum · release · alert state</text><text x="40" y="497">Operation stages + timestamp</text><text x="40" y="642">Private view · structured JSON</text><text x="40" y="672">Clear gaps and next actions</text></g><g stroke="#708654" stroke-width="2" marker-end="url(#a)"><path d="M180 180V212"/><path d="M180 355V387"/><path d="M180 530V562"/></g><text x="20" y="747" font-size="14">Unknown stays unknown.</text><text x="20" y="772" font-size="14">Expired observations need fresh evidence.</text></g></svg>
