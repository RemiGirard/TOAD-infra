<svg xmlns="http://www.w3.org/2000/svg" width="360" height="864" viewBox="0 0 360 864" role="img" aria-labelledby="title desc"><title id="title">From source to HTTPS</title><desc id="desc">Five steps: create, publish an immutable image, validate, deploy, diagnose.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c9362"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="10" y="8" width="340" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="36" font-size="10" fill="#71865b" font-weight="600">01 / MAKE IT YOURS</text><text x="28" y="69" font-size="20" fill="#23362a" font-weight="600">Source</text><text x="28" y="96" font-size="13" fill="#637457" font-weight="400">Frontend + Node API</text><text x="28" y="118" font-size="13" fill="#637457" font-weight="400">Run it locally</text><path d="M180 149 L180 166" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="173" width="340" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="201" font-size="10" fill="#71865b" font-weight="600">02 / PUBLISH</text><text x="28" y="234" font-size="20" fill="#23362a" font-weight="600">Registry image</text><text x="28" y="261" font-size="13" fill="#637457" font-weight="400">Build declared files</text><text x="28" y="283" font-size="13" fill="#637457" font-weight="400">Pin the image digest</text><path d="M180 314 L180 331" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="338" width="340" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="366" font-size="10" fill="#71865b" font-weight="600">03 / VALIDATE</text><text x="28" y="399" font-size="20" fill="#23362a" font-weight="600">App manifest</text><text x="28" y="426" font-size="13" fill="#637457" font-weight="400">Limits, secrets, routes</text><text x="28" y="448" font-size="13" fill="#637457" font-weight="400">Checked before deploy</text><path d="M180 479 L180 496" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="503" width="340" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="531" font-size="10" fill="#71865b" font-weight="600">04 / DEPLOY</text><text x="28" y="564" font-size="20" fill="#23362a" font-weight="600">Docker Swarm</text><text x="28" y="591" font-size="13" fill="#637457" font-weight="400">Rolling service update</text><text x="28" y="613" font-size="13" fill="#637457" font-weight="400">Health + rollback policy</text><path d="M180 644 L180 661" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="10" y="668" width="340" height="135" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="28" y="696" font-size="10" fill="#71865b" font-weight="600">05 / DIAGNOSE</text><text x="28" y="729" font-size="20" fill="#23362a" font-weight="600">Your HTTPS URL</text><text x="28" y="756" font-size="13" fill="#637457" font-weight="400">Replicas + failed tasks</text><text x="28" y="778" font-size="13" fill="#637457" font-weight="400">Public endpoint checks</text><text x="18" y="844" font-size="13" fill="#637457" font-weight="400">Git keeps the manifest. Diagnose each rollout.</text></g></svg>
