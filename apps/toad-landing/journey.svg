<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc"><title id="title">Cloud first, then your apps</title><desc id="desc">Prepare an operator context, apply and verify the cloud platform, then publish and deploy app releases onto it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c9362"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="4" y="6" width="548" height="260" rx="8" fill="#e3ead6" stroke="#bccaa9"/><rect x="568" y="6" width="548" height="260" rx="8" fill="#e9edde" stroke="#bccaa9"/><text x="24" y="40" font-size="11" fill="#526b3d" font-weight="600">ONCE PER PLATFORM / PROVISION YOUR CLOUD</text><text x="588" y="40" font-size="11" fill="#526b3d" font-weight="600">REPEAT PER RELEASE / DEPLOY YOUR APP</text><rect x="20" y="65" width="242" height="162" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="38" y="94" font-size="10" fill="#71865b" font-weight="600">01 / PREPARE</text><text x="38" y="129" font-size="20" fill="#23362a" font-weight="600">Operator context</text><text x="38" y="162" font-size="14" fill="#637457" font-weight="400">Cloud credentials + DNS</text><text x="38" y="187" font-size="14" fill="#637457" font-weight="400">Resource and domain choices</text><path d="M266 146 L286 146" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="294" y="65" width="242" height="162" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="312" y="94" font-size="10" fill="#71865b" font-weight="600">02 / PROVISION</text><text x="312" y="129" font-size="20" fill="#23362a" font-weight="600">Apply + verify</text><text x="312" y="162" font-size="14" fill="#637457" font-weight="400">Heat → Ansible → Swarm</text><text x="312" y="187" font-size="14" fill="#637457" font-weight="400">HTTPS + monitoring ready</text><path d="M540 146 L576 146" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="584" y="65" width="242" height="162" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="602" y="94" font-size="10" fill="#71865b" font-weight="600">03 / PUBLISH</text><text x="602" y="129" font-size="20" fill="#23362a" font-weight="600">App image</text><text x="602" y="162" font-size="14" fill="#637457" font-weight="400">Build allow-listed source</text><text x="602" y="187" font-size="14" fill="#637457" font-weight="400">Pin the registry digest</text><path d="M830 146 L850 146" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="858" y="65" width="242" height="162" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="876" y="94" font-size="10" fill="#71865b" font-weight="600">04 / SHIP</text><text x="876" y="129" font-size="20" fill="#23362a" font-weight="600">Deploy + diagnose</text><text x="876" y="162" font-size="14" fill="#637457" font-weight="400">Validate the manifest</text><text x="876" y="187" font-size="14" fill="#637457" font-weight="400">Inspect replicas + HTTPS</text><text x="20" y="300" font-size="14" fill="#637457" font-weight="400">Verify the cloud platform before deploying apps. Update apps without rebuilding the platform.</text></g></svg>
