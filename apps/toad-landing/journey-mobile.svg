<svg xmlns="http://www.w3.org/2000/svg" width="360" height="960" viewBox="0 0 360 960" role="img" aria-labelledby="title desc"><title id="title">Cloud first, then your apps</title><desc id="desc">Prepare an operator context, apply and verify the cloud platform, then publish and deploy app releases onto it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7c9362"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="8" y="8" width="344" height="444" rx="8" fill="#e3ead6" stroke="#bccaa9"/><rect x="8" y="488" width="344" height="444" rx="8" fill="#e9edde" stroke="#bccaa9"/><text x="26" y="40" font-size="11" fill="#526b3d" font-weight="600">ONCE PER PLATFORM / YOUR CLOUD</text><text x="26" y="520" font-size="11" fill="#526b3d" font-weight="600">REPEAT PER RELEASE / YOUR APP</text><rect x="24" y="60" width="312" height="154" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="42" y="89" font-size="10" fill="#71865b" font-weight="600">01 / PREPARE</text><text x="42" y="124" font-size="20" fill="#23362a" font-weight="600">Operator context</text><text x="42" y="157" font-size="14" fill="#637457" font-weight="400">Cloud credentials + DNS</text><text x="42" y="182" font-size="14" fill="#637457" font-weight="400">Resource and domain choices</text><rect x="24" y="258" width="312" height="154" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="42" y="287" font-size="10" fill="#71865b" font-weight="600">02 / PROVISION</text><text x="42" y="322" font-size="20" fill="#23362a" font-weight="600">Apply + verify</text><text x="42" y="355" font-size="14" fill="#637457" font-weight="400">Heat → Ansible → Swarm</text><text x="42" y="380" font-size="14" fill="#637457" font-weight="400">HTTPS + monitoring ready</text><rect x="24" y="540" width="312" height="154" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="42" y="569" font-size="10" fill="#71865b" font-weight="600">03 / PUBLISH</text><text x="42" y="604" font-size="20" fill="#23362a" font-weight="600">App image</text><text x="42" y="637" font-size="14" fill="#637457" font-weight="400">Build allow-listed source</text><text x="42" y="662" font-size="14" fill="#637457" font-weight="400">Pin the registry digest</text><rect x="24" y="738" width="312" height="154" rx="7" fill="#f9faf2" stroke="#bccaa9"/><text x="42" y="767" font-size="10" fill="#71865b" font-weight="600">04 / SHIP</text><text x="42" y="802" font-size="20" fill="#23362a" font-weight="600">Deploy + diagnose</text><text x="42" y="835" font-size="14" fill="#637457" font-weight="400">Validate the manifest</text><text x="42" y="860" font-size="14" fill="#637457" font-weight="400">Inspect replicas + HTTPS</text><path d="M180 220 L180 250" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 458 L180 480" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M180 700 L180 730" fill="none" stroke="#7c9362" stroke-width="1.5" marker-end="url(#arrow)"/></g></svg>
