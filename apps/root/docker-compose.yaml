services:
  landing:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    security_opt: [no-new-privileges:true]
    networks: [traefik-public]
    configs:
      - source: landing-index
        target: /usr/share/nginx/html/index.html
      - source: landing-nginx
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      labels:
        - "traefik.enable=true"
        - 'traefik.http.routers.root.rule=Host(`${ROOT_DOMAIN}`) || Host(`www.${ROOT_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+[.]${ROOT_DOMAIN_REGEX}$$`)'
        - "traefik.http.routers.root.entrypoints=websecure"
        - "traefik.http.routers.root.tls=true"
        - "traefik.http.routers.root.tls.certresolver=infomaniak"
        - "traefik.http.routers.root.tls.domains[0].main=${ROOT_DOMAIN}"
        - "traefik.http.routers.root.tls.domains[0].sans=*.${ROOT_DOMAIN}"
        - "traefik.http.routers.root.priority=1"
        - "traefik.http.services.root.loadbalancer.server.port=80"
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

configs:
  landing-index:
    file: ./index.html
  landing-nginx:
    file: ./nginx.conf

networks:
  traefik-public:
    external: true
